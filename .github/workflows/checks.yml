name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - name: Syntax check every browser script
        run: npm run check --prefix tests
      - name: Dashboard shell tests
        run: npm test --prefix tests
