name = "mtwstudio"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "ConnectionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConnectionRoom"]

[vars]
FIREBASE_PROJECT_ID = "mtw-lookup"
EMBED_ORIGIN = "https://REPLACE_WITH_YOUR_WEBFLOW_DOMAIN"
# Encrypted Cloudflare secrets required: FIREBASE_SERVICE_ACCOUNT_JSON,
# MTWSTUDIO_SETUP_KEY (random 32+ characters), and MTWSTUDIO_TOTP_KEY
# (base64-encoded 32 cryptographically random bytes). Never commit their values.
